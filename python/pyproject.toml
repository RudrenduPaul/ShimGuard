[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shimguard-cli"
version = "0.1.7"
description = "Verify that a GitHub issue closed as \"fixed\" actually has a merged fix. Catches security issues marked fixed whose PR was never merged."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Rudrendu Paul" },
  { name = "Sourav Nandy" },
]
keywords = ["security", "cli", "github", "issue-tracker", "verification", "supply-chain", "vulnerability-scanner", "agent-native", "devsecops", "pull-request"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "requests>=2.32.5,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.2,<10",
  "responses>=0.26.3,<1",
  "build>=1.2,<2",
  "twine>=5.0,<8",
]
# The mcp package requires Python >=3.10, stricter than this project's own
# >=3.9 floor, so it's kept optional rather than a base dependency.
# Pinned to >=2.0.0: mcp_server.py uses `mcp.server.MCPServer`, the current
# high-level server class -- `mcp.server.fastmcp.FastMCP` was removed in
# the 2.0.0 release.
mcp = [
  "mcp[cli]>=2.2.0",
]

[project.urls]
Homepage = "https://github.com/RudrenduPaul/ShimGuard"
Repository = "https://github.com/RudrenduPaul/ShimGuard"
"Bug Tracker" = "https://github.com/RudrenduPaul/ShimGuard/issues"
Changelog = "https://github.com/RudrenduPaul/ShimGuard/blob/main/CHANGELOG.md"
Documentation = "https://github.com/RudrenduPaul/ShimGuard/blob/main/docs/getting-started.md"
"Author - Rudrendu Paul" = "https://github.com/RudrenduPaul"
"Author - Sourav Nandy" = "https://github.com/Sourav-nandy-ai"

[project.scripts]
shimguard = "shimguard.cli:main"
shimguard-mcp = "shimguard.mcp_server:main"

[tool.hatch.build]
exclude = [".venv*/"]

[tool.hatch.build.targets.wheel]
packages = ["src/shimguard"]

[tool.hatch.build.targets.sdist]
include = [
  "src/shimguard",
  "tests",
  "README.md",
  "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
